resolver 127.0.0.11 ipv6=off valid=10s;

upstream backend_upstream {
    zone backend_upstream 64k;
    server backend:8000 resolve;
}

upstream minio_upstream {
    zone minio_upstream 64k;
    server minio:9000 resolve;
}

server {
    listen 80;
    server_name _;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Public test deployments use the same short-lived tunnel for API calls and
    # MinIO presigned GET URLs. Keep the object store itself private and expose
    # only the application bucket's read path.
    location /avatar-local/ {
        limit_except GET {
            deny all;
        }
        proxy_pass http://minio_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
